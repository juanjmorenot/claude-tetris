<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar (por defecto: dark)
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar entre modo oscuro y claro"></button>

  <div class="game-container">
    <div class="board-col">
      <h1 class="title">TETRIS</h1>

      <div class="board-wrap">
        <canvas id="board" width="360" height="720"></canvas>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <button id="restart-btn">Reiniciar</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <div class="panel-section">
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="panel-section">
        <span class="label">LINES</span>
        <span class="value" id="lines">0</span>
      </div>
      <div class="panel-section">
        <span class="label">LEVEL</span>
        <span class="value" id="level">1</span>
      </div>

      <div class="panel-section">
        <span class="label">HOLD</span>
        <canvas id="hold-canvas" width="96" height="96"></canvas>
      </div>

      <div class="panel-section">
        <span class="label">NEXT</span>
        <canvas id="next-canvas" width="96" height="96"></canvas>
      </div>

      <div class="panel-section controls">
        <span class="label">CONTROLS</span>
        <ul>
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>C</kbd> hold</li>
          <li><kbd>P</kbd> pausa</li>
        </ul>
      </div>
    </aside>
  </div>

  <script src="game.js"></script>
</body>
</html>
